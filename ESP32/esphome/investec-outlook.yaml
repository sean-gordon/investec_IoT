# Investec Outlook - ESPHome firmware for Home Assistant.
# Hardware: classic ESP32-WROOM 30-pin + TM1637 4-digit module + button.
#   TM1637 VCC -> 3V3, GND -> GND, CLK -> GPIO18, DIO -> GPIO19
#   Button: GPIO32 <-> GND
# Home Assistant pushes up to 4 characters (e.g. "1234", "12.34", "-150", "GO")
# to the "Display" text entity; the module shows it immediately.

esphome:
  name: investec-outlook
  friendly_name: Investec Outlook

esp32:
  board: esp32dev
  framework:
    type: arduino

logger:

api:
  encryption:
    key: !secret outlook_api_key

ota:
  - platform: esphome
    password: !secret outlook_ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Investec-Outlook-Setup"
    password: !secret outlook_ap_password

captive_portal:

# Text entity Home Assistant writes to. Remembers the last value after a reboot.
text:
  - platform: template
    name: "Display"
    id: display_text
    optimistic: true
    mode: text
    max_length: 8          # Dots ("12.34") do not use a digit of their own.
    initial_value: "----"
    restore_value: true

# Brightness slider in Home Assistant (0 = dim, 7 = bright).
number:
  - platform: template
    name: "Display brightness"
    id: display_brightness
    optimistic: true
    min_value: 0
    max_value: 7
    step: 1
    initial_value: 4
    restore_value: true
    on_value:
      - lambda: 'id(outlook_display).set_intensity((int) x);'

display:
  - platform: tm1637
    id: outlook_display
    clk_pin: GPIO18
    dio_pin: GPIO19
    intensity: 4
    length: 4
    update_interval: 500ms
    lambda: |-
      // Screen toggled off with the button: show OFF. The value is kept and returns when toggled back on.
      if (!id(screen_switch).state) { it.print(" OFF"); return; }
      // Dashes while Home Assistant is disconnected; the last value returns on reconnect.
      if (!esphome::api::global_api_server->is_connected()) { it.print("----"); return; }
      // Right-align so numbers line up like a meter.
      it.printf(0, "%4s", id(display_text).state.c_str());

# Screen on/off. The button toggles it; it also appears in Home Assistant and
# remembers its state after a reboot.
switch:
  - platform: template
    name: "Screen"
    id: screen_switch
    icon: mdi:monitor
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

# Physical button: each press toggles the screen between the value and OFF.
binary_sensor:
  - platform: gpio
    name: "Button"
    pin:
      number: GPIO32
      mode:
        input: true
        pullup: true
      inverted: true
    filters:
      - delayed_on_off: 40ms
    on_press:
      - switch.toggle: screen_switch
